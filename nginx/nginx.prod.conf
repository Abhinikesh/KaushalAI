worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ── Logging ─────────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  # ── Performance ──────────────────────────────────────────────────────────────
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  # ── Gzip compression ─────────────────────────────────────────────────────────
  gzip              on;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_comp_level   6;
  gzip_min_length   1024;
  gzip_types
    text/plain text/css application/json application/javascript
    text/xml application/xml application/xml+rss text/javascript
    image/svg+xml application/wasm;

  # ── Upstream blocks ──────────────────────────────────────────────────────────
  # Service names resolve via Docker Compose internal DNS
  upstream node_api {
    server server:5000;
    keepalive 32;
  }

  upstream client_spa {
    server client:80;
    keepalive 16;
  }

  # ai-service is intentionally NOT exposed publicly — it is called only by
  # the Node server over the internal Docker network. No upstream block here.

  # ── Upload body size: match the 20 MB limit enforced by multer ───────────────
  client_max_body_size 22m;   # slightly above 20 MB to avoid nginx rejecting before multer can give a clean error

  # ── HTTP server ───────────────────────────────────────────────────────────────
  # Redirect all HTTP to HTTPS in production.
  # Comment this block out if TLS termination is handled upstream (load balancer / Cloudflare).
  server {
    listen 80;
    server_name _;

    # Allow Let's Encrypt HTTP-01 challenge through
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS server ──────────────────────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN_HERE;   # ← replace with your actual domain

    # ── TLS certificates ───────────────────────────────────────────────────────
    # For Let's Encrypt (certbot): run certbot certonly --webroot before first start,
    # then mount /etc/letsencrypt into the nginx container and uncomment below.
    #
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    #
    # For self-signed (local/staging only — DO NOT use for judging):
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security headers (defence-in-depth alongside Node helmet) ────────────
    add_header X-Content-Type-Options   "nosniff"            always;
    add_header X-Frame-Options          "DENY"               always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection         "1; mode=block"      always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── /api → Node server ────────────────────────────────────────────────────
    location /api/ {
      proxy_pass         http://node_api;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";

      # Generous timeout for LLM-backed quiz generation (up to 2 minutes)
      proxy_read_timeout  130s;
      proxy_send_timeout  130s;
      proxy_connect_timeout 10s;

      # Pass cookies for the httpOnly refresh token
      proxy_pass_header  Set-Cookie;
    }

    # ── / → client static SPA ─────────────────────────────────────────────────
    location / {
      proxy_pass         http://client_spa;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Block all other paths ─────────────────────────────────────────────────
    location /internal/ {
      return 404;
    }

    location /ai/ {
      return 404;   # ai-service is not publicly routable
    }
  }
}
