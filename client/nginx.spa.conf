# Minimal nginx config for the client container.
# This container only serves the Vite static build.
# All /api/* and other routes are handled by the top-level reverse proxy.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unmatched path → index.html (React Router handles it)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively — Vite fingerprints all asset filenames
    location ~* \.(js|css|woff2?|svg|png|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Never cache index.html (always fetch fresh so new deploys take effect)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
